[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-ai-advisory"
version = "0.1.0"
description = "AI-powered HR advisory platform with employment law compliance"
authors = [
    {name = "Terrene Foundation", email = "dev@arbor.terrene.dev"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Kailash SDK — EATP/trust-plane integrated into kailash core v2.0+
    "kailash>=2.0.0",
    "kailash-nexus>=1.4.3",
    "kailash-dataflow>=1.2.0",
    "kailash-kaizen>=2.1.0",
    # CLI Framework
    "click>=8.0",
    "rich>=13.0.0",
    # Database migrations
    "alembic>=1.12.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    # pgvector support
    "pgvector>=0.3.0",
    # Document generation
    "python-docx>=1.1.0",
    # Email
    "sendgrid>=6.11.0",
    # JWT auth
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    # PostgreSQL driver
    "psycopg2-binary>=2.9.9",
    # LLM provider (required by Kaizen agents for response generation)
    "openai>=1.30.0",
    # Async HTTP client (MCP integration adapters)
    "httpx>=0.27.0",
    # Encryption (OAuth token store, PII encryption)
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
ml = [
    # PyTorch - On Windows, install separately: pip install torch --index-url https://download.pytorch.org/whl/cu118
    "torch>=2.7.1",
]
dev = [
    # Testing (pytest>=7.2.0 removes vulnerable py dependency)
    "pytest>=7.2.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    # Linting & Formatting
    "black>=23.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    # Security & Pre-commit
    "detect-secrets>=1.5.0",
    "pre-commit>=4.2.0",
]

[project.urls]
"Homepage" = "https://github.com/terrene-foundation/arbor"
"Bug Tracker" = "https://github.com/terrene-foundation/arbor/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", ".*", "__pycache__*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
