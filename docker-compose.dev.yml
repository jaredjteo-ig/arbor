services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arbor-postgres
    environment:
      POSTGRES_USER: arbor
      POSTGRES_PASSWORD: arbor
      POSTGRES_DB: arbor
    ports:
      - "5432:5432"
    volumes:
      - arbor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arbor-redis
    ports:
      - "6379:6379"
    volumes:
      - arbor_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arbor_pgdata:
  arbor_redis:
