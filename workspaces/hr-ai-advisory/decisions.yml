decisions:
  # ── M10: Demo-Ready UX ──────────────────────────────────────
  - decision: "JWT tokens stored in localStorage for web frontend"
    rationale: "Standard SPA pattern. httpOnly cookies require backend proxy setup not viable for MVP. Server-side token blocklist (JTI) provides revocation capability."
    alternatives_rejected: "httpOnly cookies (requires BFF pattern), in-memory only (lost on refresh)"
    date: 2026-03-13
    initiative: hr-ai-advisory
    confidence: medium
    note: "Future recommendation: move to httpOnly cookie-based auth for XSS resilience"

  - decision: "SSE streaming via fetch+ReadableStream instead of EventSource"
    rationale: "EventSource only supports GET without custom headers. Advisory queries need POST with JWT auth headers."
    alternatives_rejected: "EventSource (no custom headers), WebSocket (overkill for unidirectional streaming)"
    date: 2026-03-13
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Design tokens generated from tokens.json via Python script to CSS/TS/Dart"
    rationale: "Single source of truth for cross-platform design consistency. Python generator produces CSS custom properties, TypeScript constants, and Dart theme data."
    alternatives_rejected: "Manual token duplication, Style Dictionary (added complexity for 3-target output)"
    date: 2026-03-13
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Typography scale uses CSS utility classes (.text-display through .text-micro) instead of Tailwind's built-in text sizes"
    rationale: "Custom scale matches Singapore government-adjacent design language. Responds to --text-size-multiplier for accessibility text resizing."
    alternatives_rejected: "Tailwind defaults (don't support multiplier-based accessibility), CSS-in-JS (poor DX with Tailwind)"
    date: 2026-03-13
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Advisory chat uses real-time SSE streaming with risk-tier-aware UI"
    rationale: "Enterprise users expect immediate feedback. Risk tier colors (green/amber/red) provide instant visual trust signal. Streaming tokens reduce perceived latency."
    alternatives_rejected: "Polling (poor UX), full response wait (high perceived latency)"
    date: 2026-03-13
    initiative: hr-ai-advisory
    confidence: high

  # ── M11: AI Trust & Safety ──────────────────────────────────
  - decision: "In-memory conversation storage with _conversation_owners dict for tenant isolation"
    rationale: "MVP approach — fast to implement, no DB dependency. Tenant isolation added via ownership mapping since ShortTermMemory doesn't store user_id."
    alternatives_rejected: "Database-backed conversations (deferred to post-MVP), session-scoped only (no history feature)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: medium
    note: "Conversations lost on server restart. Database persistence planned."

  - decision: "Thread-safe escalation counter using itertools.count(1)"
    rationale: "Python's itertools.count is thread-safe via GIL for next() calls. Replaces non-atomic global += 1 pattern."
    alternatives_rejected: "threading.Lock (heavier), uuid-based IDs (less human-readable for ESC- prefix)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: high

  - decision: "SSE stream 401 retry with automatic token refresh"
    rationale: "SSE client bypassed the apiClient's built-in token refresh. Expired JWT during streaming produced opaque errors."
    alternatives_rejected: "Pre-flight token check (race condition window), forcing re-login (poor UX)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: high

  - decision: "CSV injection prevention via single-quote prefix for dangerous cell characters"
    rationale: "Conversation titles/messages could start with =, +, -, @ which spreadsheet apps interpret as formulas. Industry-standard mitigation."
    alternatives_rejected: "Stripping characters (data loss), Excel-specific escaping (not portable)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: high

  # ── M12: Enterprise Polish ──────────────────────────────────
  - decision: "prefers-reduced-motion media query suppresses all animations"
    rationale: "WCAG 2.1 Level AA requirement. Users with motion sensitivities or vestibular disorders need this."
    alternatives_rejected: "Per-animation opt-out (incomplete coverage), user toggle only (doesn't respect OS setting)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Legal disclaimer text uses gray-500 instead of gray-400 for WCAG AA contrast"
    rationale: "gray-400 (#94A3B8) on white background fails 4.5:1 contrast ratio. gray-500 (#64748B) passes."
    alternatives_rejected: "Larger text (would change layout), background tint (inconsistent with card surfaces)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: high

  - decision: "SearchResults selectableItems wrapped in useMemo"
    rationale: "Array was recreated every render causing unnecessary event listener teardown/setup in keyboard navigation."
    alternatives_rejected: "useCallback (doesn't memoize data), external state (overkill for derived array)"
    date: 2026-03-14
    initiative: hr-ai-advisory
    confidence: high

  # ── M16-M27: Full HRIS Buildout ───────────────────────────────
  - decision: "Arbor is a free public platform backed by ASME, not a startup"
    rationale: "ASME absorbs operational costs as a member service. Unit economics concerns are less relevant for a public good."
    alternatives_rejected: "Freemium SaaS, advisory-only (user chose full HRIS)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Payroll engine is deterministic — zero LLM involvement"
    rationale: "CPF uses specific lookup tables. AI in payroll math is a compliance and trust risk per value critique."
    alternatives_rejected: "AI-assisted payroll, hybrid approach"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "PII encryption uses Fernet with development-mode fallback"
    rationale: "PDPA requires encryption at rest. Dev fallback prevents local development friction."
    alternatives_rejected: "AES-256-GCM (complex key mgmt), database-level encryption"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "CPF rates aligned with tested cpf_calculator.py"
    rationale: "Red team found payroll calculator had wrong rates for ages 55-70. Single source of truth prevents divergence."
    alternatives_rejected: "Payroll calling CPF calculator directly (different signatures)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Claims marked as paid only on payroll mark-paid, not during draft calculation"
    rationale: "Red team found cancelled runs left claims incorrectly marked as paid."
    alternatives_rejected: "Mark during calculation with rollback on cancel"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Owner-only payroll approval with separation of duties"
    rationale: "HR managers prepare payroll, only owner authorises payment. Standard financial control."
    alternatives_rejected: "Both roles approve, multi-signature"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Cross-module queries use try/except resilience — partial payroll over no payroll"
    rationale: "If leave fetch fails, payroll proceeds with zero deductions. Better partial payroll for deadline compliance."
    alternatives_rejected: "Fail entire run on module error (too disruptive)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: medium

  # ── M28-M32: MCP Integration Layer ────────────────────────────
  - decision: "5 domain-grouped MCP servers instead of one-per-API or monolithic"
    rationale: "Balances tool discoverability (LLM sees related tools together), least-privilege (separate credential scopes), and failure isolation (banking down doesn't affect accounting)."
    alternatives_rejected: "One server per API (40+ connections), single monolithic server (shared blast radius)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "MCP tools use {domain}_{verb}_{noun} naming (e.g., gov_cpf_submit)"
    rationale: "Self-documenting for LLM tool selection. Domain prefix groups related tools. Verb+noun describes the action clearly."
    alternatives_rejected: "Flat names (submit_cpf), generic names (process_submission)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "File-based bank payments as default, direct bank API as premium"
    rationale: "ISO 20022 GIRO files work with all SG banks via e-banking upload. Direct bank APIs (DBS RAPID, UOB, OCBC) require per-tenant corporate banking onboarding."
    alternatives_rejected: "Direct API only (too much onboarding friction), file-only (misses real-time capability)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Idempotency ledger for all government and bank submissions"
    rationale: "Red team C3: Shadow agent retries could cause duplicate CPF submissions. CPF Board does not auto-deduplicate."
    alternatives_rejected: "No deduplication (risk), LLM-level deduplication (unreliable)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "PII stripping before LLM calls for PDPA cross-border compliance"
    rationale: "Red team C5: Employee salary/NRIC data flows through offshore LLM providers. PDPA Section 26 requires consent or safeguards for cross-border PII transfer."
    alternatives_rejected: "SG-region LLM only (limits model choice), explicit consent only (friction)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Human confirmation gates on all irreversible operations"
    rationale: "Shadow agent brief Part 3: government submissions, bank payments, and bulk operations always require explicit human approval before execution."
    alternatives_rejected: "Autonomous execution (too risky), per-operation toggle (complex UX)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "Dynamic tool loading: 15-25 tools per context instead of 80+"
    rationale: "Red team M8: LLM tool-calling accuracy degrades beyond ~20 tools. Page-context filtering reduces set to relevant tools only."
    alternatives_rejected: "All tools always (LLM confusion), manual tool selection (poor UX)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "OAuth CSRF state validation on all external OAuth flows"
    rationale: "Security audit found Xero/QBO/Zoho callbacks lacked CSRF protection. State parameter now generated, stored with 10-min TTL, and validated on callback."
    alternatives_rejected: "No state (CSRF vulnerable), session-based (complex with multi-tab)"
    date: 2026-03-18
    initiative: hr-ai-advisory
    confidence: high

  - decision: "One-Stop Payroll (OSP) registration as critical path for government APIs"
    rationale: "CPF APEX, IRAS AIS, and MOM OED all go through GovTech's APEX platform. Single registration unlocks all three."
    alternatives_rejected: "Individual API registrations (duplicated effort), file-only forever (misses 1-click submission)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: high

  - decision: "In-memory persistence for MVP, DataFlow models for production"
    rationale: "Architectural patterns are DB-ready (singleton classes with store/retrieve interfaces). In-memory allows rapid development. Production migration is a swap, not a rewrite."
    alternatives_rejected: "DB from day one (slower iteration), Redis only (not durable enough for submissions)"
    date: 2026-03-17
    initiative: hr-ai-advisory
    confidence: medium
    note: "SubmissionLedger and SagaOrchestrator MUST be persisted before production deployment."

  # ── Session 3: Open-Source Prep + Full Platform Build (2026-03-18) ──

  - decision: "Rename AITE to Arbor for open-source under Terrene Foundation"
    rationale: "AITE is an ASME institution name; Arbor is neutral and evokes growth/nature, fitting Terrene Foundation's earth theme"
    alternatives_rejected: "Kairon (Kai- prefix reserved for Kailash stack), Meridian, Sage, Praxis"
    date: 2026-03-18
    initiative: open-source-prep
    confidence: high

  - decision: "Remove all competitor analysis and comparison language before open-source"
    rationale: "Competitor-specific benchmarking inappropriate for open-source project; replaced with generic feature descriptions"
    alternatives_rejected: "Keep references as historical context"
    date: 2026-03-18
    initiative: open-source-prep
    confidence: high

  - decision: "Python package stays hr_advisory despite brand rename to Arbor"
    rationale: "Package name describes function not brand; avoids massive import chain refactor"
    alternatives_rejected: "Rename to arbor_hr (too disruptive to imports)"
    date: 2026-03-18
    initiative: open-source-prep
    confidence: high

  - decision: "12-tab employee detail page instead of separate pages"
    rationale: "Single-page with tabs provides complete employee view; industry-standard pattern; reduces navigation"
    alternatives_rejected: "Separate pages per section (more files, more navigation)"
    date: 2026-03-18
    initiative: employee-detail
    confidence: high

  - decision: "33 new DataFlow models in single company_user.py file"
    rationale: "All models share the same database connection and are co-dependent; splitting would create circular imports"
    alternatives_rejected: "Separate model files per module"
    date: 2026-03-18
    initiative: full-platform
    confidence: medium

  - decision: "6 new standalone router files rather than extending existing routers"
    rationale: "Each module (appraisals, projects, inventory, recruitment, reports, approval_groups) is independent; separate files prevent existing routers from growing beyond maintainable size"
    alternatives_rejected: "Add endpoints to existing routers (employees.py already 3800 lines)"
    date: 2026-03-18
    initiative: full-platform
    confidence: high

  - decision: "CSS-only charts in reports (BarChart, DonutChart, TrendLine) without npm dependencies"
    rationale: "Minimizes bundle size; conic-gradient and SVG path are sufficient for dashboard visualizations"
    alternatives_rejected: "Chart.js, Recharts, D3 (heavy dependencies for simple charts)"
    date: 2026-03-18
    initiative: full-platform
    confidence: high

  - decision: "In-memory rate limiting for MVP, not Redis-based"
    rationale: "Sufficient for single-process deployment; Redis-based rate limiting is a production upgrade path"
    alternatives_rejected: "Redis rate limiting (requires Redis dependency), no rate limiting"
    date: 2026-03-18
    initiative: security
    confidence: medium

  - decision: "EmployeePicker with client-side search rather than server-side autocomplete"
    rationale: "Employee lists are small (<500 per company); client-side filtering is instant; avoids debounce/API complexity"
    alternatives_rejected: "Server-side search endpoint with debounce"
    date: 2026-03-18
    initiative: ux-polish
    confidence: high

  - decision: "HTML5 native date inputs (type=date) instead of custom date picker library"
    rationale: "Zero dependencies; browser-native accessibility; consistent across modern browsers"
    alternatives_rejected: "react-datepicker, @headlessui date picker"
    date: 2026-03-18
    initiative: ux-polish
    confidence: high

  - decision: "Demo seed data included in company creation for all modules"
    rationale: "New companies see realistic data immediately; demonstrates platform capabilities; aids demos and testing"
    alternatives_rejected: "Empty state only, separate seed command"
    date: 2026-03-18
    initiative: full-platform
    confidence: high
