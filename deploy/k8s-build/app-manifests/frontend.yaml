# Arbor — Frontend (Next.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbor-frontend
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arbor-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbor-frontend
        app.kubernetes.io/part-of: arbor
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY_ORG/arbor-frontend:ARBOR_VERSION
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: arbor-deploy-config
                  key: api-url
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: arbor-app-secrets
                  key: GOOGLE_OAUTH_CLIENT_ID
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: arbor-frontend
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: arbor-frontend
  ports:
    - port: 3000
      targetPort: 3000
