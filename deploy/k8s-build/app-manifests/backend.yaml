# Arbor — Backend API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbor-backend
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arbor-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbor-backend
        app.kubernetes.io/part-of: arbor
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: REGISTRY_ORG/arbor-backend:ARBOR_VERSION
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: arbor-app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: arbor-backend
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: arbor-backend
  ports:
    - port: 8000
      targetPort: 8000
