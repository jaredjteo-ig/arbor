# Arbor — Redis 7
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arbor-redis-data
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbor-redis
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arbor-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbor-redis
        app.kubernetes.io/part-of: arbor
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arbor-app-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: arbor-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: arbor-redis
  labels:
    app.kubernetes.io/part-of: arbor
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: arbor-redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
